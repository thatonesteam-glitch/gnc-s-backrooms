    <meta charset="UTF-8">

    <title>Backrooms Escape (First-Person)</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5em;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.5);
            text-align: center;
            display: none; /* Hidden by default */
            z-index: 10;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 2em;
            cursor: pointer;
            z-index: 10; /* Make sure it's on top */
        }
        #overlay p {
            font-size: 0.7em;
            /* Make help text wrap better */
            max-width: 80%;
            line-height: 1.4;
        }
        /* --- New Restart Button Style --- */
        #restartButton {
            display: none; /* Hidden by default */
            font-size: 0.8em;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
        }
        #restartButton:hover {
            background-color: #555;
        }

        /* --- New Stamina Bar Style --- */
        #staminaContainer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 200px;
            height: 20px;
            border: 2px solid #fff;
            background-color: #000;
            border-radius: 5px;
            z-index: 10;
        }
        #staminaBar {
            width: 100%;
            height: 100%;
            background-color: #00ff00;
            transition: width 0.2s linear;
        }

        /* --- NEW Crosshair Style --- */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-family: monospace;
            opacity: 0.5;
            pointer-events: none; /* So it doesn't block clicks */
            z-index: 20;
            display: none; /* Hide by default */
        }
    </style>
</head>

        // --- NEW: Helper function to create Backrooms Monster ---
        function createBackroomsMonster() {
            const monster = new THREE.Group();
            // --- NEW: Dark grey, transparent material ---
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x333333, 
                roughness: 0.9,
                transparent: true,
                opacity: 0.4
            });

            // Torso
            const torsoGeo = new THREE.BoxGeometry(0.5, 3.5, 0.5);
            const torso = new THREE.Mesh(torsoGeo, mat);
            torso.position.y = 1.75; // Stand on the floor
            monster.add(torso);

            // Head (simple sphere)
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const head = new THREE.Mesh(headGeo, mat);
            head.position.y = 3.8; // On top of torso
            monster.add(head);

            // Limbs
            const limbGeo = new THREE.BoxGeometry(0.15, 2, 0.15);
            
            // Left Arm
            const leftArm = new THREE.Mesh(limbGeo, mat);
            leftArm.position.set(-0.4, 2.5, 0);
            leftArm.rotation.z = 0.3; // Angle out
            monster.add(leftArm);

            // Right Arm
            const rightArm = new THREE.Mesh(limbGeo, mat);
            rightArm.position.set(0.4, 2.5, 0);
            rightArm.rotation.z = -0.3; // Angle out
            monster.add(rightArm);
            
            // Left Leg
            const leftLeg = new THREE.Mesh(limbGeo, mat);
            leftLeg.position.set(-0.2, 0.9, 0);
            monster.add(leftLeg);

            // Right Leg
            const rightLeg = new THREE.Mesh(limbGeo, mat);
            rightLeg.position.set(0.2, 0.9, 0);
            monster.add(rightLeg);
            
            // Red light
            const entityLight = new THREE.PointLight(0xff0000, 2, 3);
            entityLight.position.y = 3.8; // Put light in head
            monster.add(entityLight);

            return monster;
        }

        // --- NEW Helper Function to Create 3D Key ---
        function createKeyMesh() {
            const keyGroup = new THREE.Group();
            const keyMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xaaaa00 });

            // Handle
            const handleGeo = new THREE.TorusGeometry(0.15, 0.05, 8, 16);
            const handle = new THREE.Mesh(handleGeo, keyMat);
            handle.position.y = 0.3;
            keyGroup.add(handle);

            // Shaft
            const shaftGeo = new THREE.BoxGeometry(0.05, 0.4, 0.05);
            const shaft = new THREE.Mesh(shaftGeo, keyMat);
            shaft.position.y = 0.05;
            keyGroup.add(shaft);

            // Teeth
            const tooth1Geo = new THREE.BoxGeometry(0.05, 0.05, 0.1);
            const tooth1 = new THREE.Mesh(tooth1Geo, keyMat);
            tooth1.position.set(0, -0.1, 0.05);
            keyGroup.add(tooth1);

            const tooth2 = new THREE.Mesh(tooth1Geo, keyMat);
            tooth2.position.set(0, -0.05, 0.05);
            keyGroup.add(tooth2);

            // Invisible Collider
            const colliderGeo = new THREE.BoxGeometry(0.5, 0.8, 0.5);
            const colliderMat = new THREE.MeshBasicMaterial({ visible: false, transparent: true });
            const collider = new THREE.Mesh(colliderGeo, colliderMat);
            collider.position.y = 0.15; // Center the collider
            keyGroup.add(collider);
            keyGroup.userData.collider = collider; // Store for collision checks

            keyGroup.scale.set(1.5, 1.5, 1.5); // Make it a bit bigger
            return keyGroup;
        }

            // --- Player "Hitbox" ---

            const playerMat = new THREE.MeshBasicMaterial({ visible: false });

            camera.position.set(0, 0.7, 0);
            scene.add(player);

        // --- MODIFIED: Pass map directly ---

        // --- NEW: Helper function for AI patrol ---

        // --- NEW Function to build the key room ---

        // --- New Mouse Handler (for Pointer Lock) ---
        function onMouseMove(e) {
            if (!gameState.gameStarted) return;
            const deltaX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
            const deltaY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
            const factor = 0.002;
            player.rotation.y -= deltaX * factor;
            const maxPitch = Math.PI / 2 * 0.9;
            camera.rotation.x -= deltaY * factor;
            camera.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, camera.rotation.x));
        }

        // --- Keyboard Handlers ---
        function onKeyDown(e) {
            keys[e.code] = true;
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'ShiftLeft': isSprinting = true; break;
                case 'ArrowUp': lookUp = true; break;
                case 'ArrowDown': lookDown = true; break;
                case 'ArrowLeft': turnLeft = true; break;
                case 'ArrowRight': turnRight = true; break;
            }
        }
        
        function onKeyUp(e) {
            keys[e.code] = false;
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': isSprinting = false; break;
                case 'ArrowUp': lookUp = false; break;
                case 'ArrowDown': lookDown = false; break;
                case 'ArrowLeft': turnLeft = false; break;
                case 'ArrowRight': turnRight = false; break;
                case 'KeyR':
                    if (gameState.gameOver || gameState.gameWon) {
                        restartGame();
                    }
                    break;
            }
        }

        // --- Game Loop (Animate) ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // --- Jumpscare Animation Loop ---
            if (gameState.isJumpscaring) {
                entity.scale.lerp(new THREE.Vector3(10, 10, 10), 0.15); // Scale up 3D model
                if (entity.children[0]) {
                    // Find the point light
                    const light = entity.children.find(c => c.isPointLight);
                    if (light) light.intensity = 10 + Math.sin(elapsedTime * 100) * 2;
                }
                renderer.render(scene, camera);
                return;
            }

            if (!gameState.gameStarted) {
                renderer.render(scene, camera);
                return;
            }
            
            if (gameState.gameOver || gameState.gameWon) {
                return;
            }

            // --- Handle Keyboard Camera Turning ---
            const maxPitch = Math.PI / 2 * 0.9;
            if (turnLeft) player.rotation.y += gameState.turnSpeed * delta;
            if (turnRight) player.rotation.y -= gameState.turnSpeed * delta;
            if (lookUp) {
                camera.rotation.x += gameState.turnSpeed * delta;
                camera.rotation.x = Math.min(maxPitch, camera.rotation.x);
            }
            if (lookDown) {
                camera.rotation.x -= gameState.turnSpeed * delta;
                camera.rotation.x = Math.max(-maxPitch, camera.rotation.x);
            }

            // --- Update Logic ---
            const isMoving = moveForward || moveBackward || moveLeft || moveRight;
            handleMovement(delta, isMoving);
            updateEntity(delta, elapsedTime);
            updateObjects(elapsedTime);
            checkCollisions();
            updateArms(elapsedTime, isMoving, isSprinting); // --- NEW: Animate arms ---

            // --- Update Stamina Bar ---
            staminaBarElement.style.width = (gameState.stamina / gameState.maxStamina) * 100 + '%';
            
            // --- Play Footstep Sound ---
            if (isMoving && !isSprinting && elapsedTime - lastStepTime > 0.4) {
                sounds.footstep.triggerAttackRelease('8n');
                lastStepTime = elapsedTime;
            }

            // --- Render ---
            renderer.render(scene, camera);
        }

        // --- NEW: Function to animate arms (More Realistic) ---
        function updateArms(elapsedTime, isMoving, isSprinting) {
            const restY = -0.6; // Resting Y position
            const restZ = -0.2; // Resting Z position (WAS -0.7)
            const restXLeft = -0.8;
            const restXRight = 0.8;
            
            if (isMoving) {
                // --- Walking / Sprinting Animation ---
                const speed = isSprinting ? 18 : 10; // How fast arms swing
                const swingAmplitudeZ = isSprinting ? 0.3 : 0.2; // How far arms swing (Z-axis)
                const swingAmplitudeX = isSprinting ? 0.05 : 0.03; // How far arms swing (X-axis)
                const bobAmplitude = isSprinting ? 0.15 : 0.08; // How much arms bob
                
                // Calculate swing and bob
                const swingZ = Math.sin(elapsedTime * speed) * swingAmplitudeZ;
                const swingX = Math.cos(elapsedTime * speed) * swingAmplitudeX; // Offset from Z swing
                const bob = Math.abs(Math.sin(elapsedTime * speed * 0.5)) * bobAmplitude;

                // Apply to arms
                // Left Arm: Swings forward (negative Z) when right leg is forward
                leftArm.position.z = restZ + swingZ;
                leftArm.position.x = restXLeft + swingX;
                leftArm.position.y = restY - bob;
                leftArm.rotation.x = swingZ * 0.5; // Add a slight rotation

                // Right Arm: Swings back (positive Z) when left leg is forward
                rightArm.position.z = restZ - swingZ;
                rightArm.position.x = restXRight + swingX; // Both arms swing inward/outward together
                rightArm.position.y = restY - bob;
                rightArm.rotation.x = -swingZ * 0.5; // Add a slight rotation

            } else {
                // --- Idle Animation (smoothly return to rest) ---
                leftArm.position.lerp(new THREE.Vector3(restXLeft, restY, restZ), 0.1);
                rightArm.position.lerp(new THREE.Vector3(restXRight, restY, restZ), 0.1);
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
                rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
            }
        }

        // --- Handle Player Movement ---
        function handleMovement(delta, isMoving) {
            playerVelocity.x -= playerVelocity.x * 10.0 * delta;
            playerVelocity.z -= playerVelocity.z * 10.0 * delta;

            moveDirection.z = Number(moveBackward) - Number(moveForward);
            moveDirection.x = Number(moveRight) - Number(moveLeft);
            moveDirection.normalize();

            // --- Stamina Logic ---
            let currentSpeed = gameState.playerSpeed;
            if (isSprinting && isMoving && gameState.stamina > 0) {
                currentSpeed = gameState.playerSpeed * gameState.sprintMultiplier;
                gameState.stamina = Math.max(0, gameState.stamina - 1.5); // Drain
            } else if (gameState.stamina < gameState.maxStamina) {
                gameState.stamina = Math.min(gameState.maxStamina, gameState.stamina + 0.5); // Regen
            }
            // Can't sprint if stamina is 0
            if (gameState.stamina === 0) {
                currentSpeed = gameState.playerSpeed;
            }

            const cameraDirection = new THREE.Vector3();
            player.getWorldDirection(cameraDirection);
            cameraDirection.y = 0;
            cameraDirection.normalize();

            const rightDirection = new THREE.Vector3().crossVectors(camera.up, cameraDirection).normalize();
            
            if (moveForward || moveBackward) {
                playerVelocity.add(cameraDirection.multiplyScalar(moveDirection.z * currentSpeed * 10.0 * delta));
            }
            if (moveLeft || moveRight) {
                playerVelocity.add(rightDirection.multiplyScalar(moveDirection.x * currentSpeed * 10.0 * delta));
            }

            // Wall Collision & Sliding
            const oldPos = player.position.clone();
            
            player.position.x += playerVelocity.x * delta;
            playerBox.setFromObject(player);
            for (const box of wallBoxes) {
                if (playerBox.intersectsBox(box)) {
                    player.position.x = oldPos.x;
                    playerVelocity.x = 0;
                    break;
                }
            }

            player.position.z += playerVelocity.z * delta;
            playerBox.setFromObject(player);
            for (const box of wallBoxes) {
                if (playerBox.intersectsBox(box)) {
                    player.position.z = oldPos.z;
                    playerVelocity.z = 0;
                    break;
                }
            }
        }

        // --- Update Entity AI (with Wall Collision) ---
        function updateEntity(delta, elapsedTime) {
            const playerPos = player.position;
            const entityPos = entity.position;

            // --- NEW: Smart AI Logic ---
            const directionToPlayer = new THREE.Vector3().subVectors(playerPos, entityPos).normalize();
            raycaster.set(entityPos, directionToPlayer);
            const intersects = raycaster.intersectObjects(wallMeshes);
            
            let playerVisible = false;
            if (intersects.length === 0 || intersects[0].distance > entityPos.distanceTo(playerPos) - 1.0) {
                playerVisible = true;
            }

            let targetPosition = new THREE.Vector3();

            if (playerVisible) {
                // Player is visible: CHASE
                entity.userData.isChasing = true;
                entity.userData.lastKnownPosition = playerPos.clone();
                targetPosition.copy(playerPos);
            } else {
                // Player is hidden
                if (entity.userData.isChasing) {
                    // Was chasing, move to last known position
                    targetPosition.copy(entity.userData.lastKnownPosition);
                    if (entityPos.distanceTo(targetPosition) < 2) {
                        // Arrived at last known spot, player not here.
                        entity.userData.isChasing = false;
                        findNewPatrolTarget(levels[gameState.level - 1]);
                        targetPosition.copy(entity.userData.patrolTarget);
                    }
                } else {
                    // Not chasing: PATROL
                    targetPosition.copy(entity.userData.patrolTarget);
                    if (entityPos.distanceTo(targetPosition) < 2) {
                        // Arrived at patrol spot, find a new one
                        findNewPatrolTarget(levels[gameState.level - 1]);
                        targetPosition.copy(entity.userData.patrolTarget);
                    }
                }
            }

            // --- Entity Movement (same as before) ---
            const moveVector = new THREE.Vector3(
                targetPosition.x - entityPos.x,
                0,
                targetPosition.z - entityPos.z
            ).normalize();

            const oldPos = entity.position.clone();
            // --- Use dynamic entity speed ---
            const moveX = moveVector.x * gameState.entitySpeed * delta;
            const moveZ = moveVector.z * gameState.entitySpeed * delta;

            // Try moving X
            entity.position.x += moveX;
            entityBox.setFromObject(entity); // Update entity box for collision
            for (const box of wallBoxes) {
                if (entityBox.intersectsBox(box)) {
                    entity.position.x = oldPos.x;
                    break;
                }
            }

            // Try moving Z
            entity.position.z += moveZ;
            entityBox.setFromObject(entity); // Update entity box for collision
            for (const box of wallBoxes) {
                if (entityBox.intersectsBox(box)) {
                    entity.position.z = oldPos.z;
                    break;
                }
            }
            // --- End Entity Movement ---
            
            // --- Make monster face the direction it's moving ---
            if (moveX !== 0 || moveZ !== 0) {
                 entity.rotation.y = Math.atan2(moveX, moveZ);
            }

            // --- Humming Sound Logic ---
            const dist = player.position.distanceTo(entity.position);
            const maxDist = 30; // How far away the hum starts
            if (dist < maxDist) {
                // Volume goes from -40dB (quiet) to -10dB (loud)
                const vol = -40 + (1 - (dist / maxDist)) * 30; 
                sounds.hum.volume.rampTo(vol, 0.1);
            } else {
                // Fade out
                sounds.hum.volume.rampTo(-Infinity, 0.5);
            }
        }

        // --- Update Other Objects ---
        function updateObjects(elapsedTime) {
            if (key) {
                key.rotation.y += 0.05;
            }
            
            // Pulse the entity's "heart"
            if (entity && entity.children[0]) {
                const light = entity.children.find(c => c.isPointLight);
                if (light) {
                    const pulse = Math.sin(elapsedTime * 5) * 0.5 + 0.5;
                    light.intensity = pulse * 2 + 1;
                }
            }

            // Flicker Ceiling Lights
            for (const light of ceilingLights) {
                if (Math.random() > 0.9) {
                    light.intensity = 0.5 + Math.random() * 0.4; // --- DARKER: (Was 1.0) ---
                }
            }
        }

        // --- Check Collisions ---
        function checkCollisions() {
            playerBox.setFromObject(player);
            // --- Use Box3 for 3D model monster ---
            entityBox.setFromObject(entity);
            
            // --- COLLISION uses the invisible collider now ---
            if (door && door.userData.collider) {
                door.userData.collider.updateWorldMatrix(true, false);
                doorBox.setFromObject(door.userData.collider);
            }
            if (key && key.userData.collider) {
                // --- Use the new key's collider ---
                key.userData.collider.updateWorldMatrix(true, false);
                keyBox.setFromObject(key.userData.collider);
            }


            // 1. Player vs Entity
            if (!gameState.isJumpscaring && playerBox.intersectsBox(entityBox)) {
                startJumpscare();
                return;
            }

            // 2. Player vs Key
            if (key && playerBox.intersectsBox(keyBox)) {
                collectKey();
            }

            // 3. Player vs Door
            if (door && playerBox.intersectsBox(doorBox)) { // Check intersection
                if (gameState.hasKey) {
                    loadLevel(gameState.level + 1);
                } else {
                    gameOver("THE LOCKED DOOR KILLED YOU!");
                }
            }
        }

        // --- Game State Functions ---
        function collectKey() {
            scene.remove(key);
            key = null;
            gameState.hasKey = true;
            // --- Update the new door panel's material ---
            if (doorPanel) {
                doorPanel.material.color.set(0x00ff00);
                doorPanel.material.emissive.set(0x005500);
            }
            showMessage("Key Acquired! Find the GREEN Door!");
            // Play key pickup sound
            sounds.keyPickup.triggerAttackRelease('C5', '0.5s');
        }

        // --- New Jumpscare Function ---
        function startJumpscare() {
            gameState.isJumpscaring = true;
            gameState.gameStarted = false;
            document.exitPointerLock();

            // --- Play Scream Sound (Loud, Long, Scary) ---
            sounds.scream.triggerAttack("G5"); // Start the note
            // Make the pitch fall from G5 down to C4
            sounds.scream.frequency.rampTo("C4", 0.8); 
            // Stop the sound after 1 second
            sounds.scream.triggerRelease("+1.0");

            // Stop the hum
            sounds.hum.volume.rampTo(-Infinity, 0.1);

            // Play jumpscare sound
            sounds.jumpscare.triggerAttackRelease('0.5s');

            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            const camPos = new THREE.Vector3();
            camera.getWorldPosition(camPos);

            entity.position.copy(camPos.add(forward.multiplyScalar(0.8)));
            
            // Make entity look at camera for jumpscare
            entity.lookAt(camPos);
            
            const light = entity.children.find(c => c.isPointLight);
            if (light) {
                light.intensity = 10;
            }

            setTimeout(() => {
                gameOver("EATEN BY THE ENTITY!");
                gameState.isJumpscaring = false;
            }, 750); // Jumpscare visual duration
        }

        function gameOver(message) {
            gameState.gameOver = true;
            gameState.gameStarted = false;
            overlayTitle.textContent = "GAME OVER";
            restartButton.style.display = 'block';
            showMessage(`${message}`);
        }

        function gameBeaten() {
            gameState.gameWon = true;
            gameState.gameStarted = false;
            document.exitPointerLock();
            overlayTitle.textContent = "YOU ESCAPED!";
            restartButton.style.display = 'block';
            showMessage(`YOU WIN! (Press R to Restart)`);
        }

        function restartGame() {
            window.location.reload();
        }

        function showMessage(msg) {
            messageDiv.textContent = msg;
            messageDiv.style.display = 'block';
        }

        // --- Handle Window Resize ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Start the game ---
        init();
        
    </script>
</body>
</html>
